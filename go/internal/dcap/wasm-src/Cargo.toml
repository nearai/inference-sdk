[package]
name = "nearai-dcap-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dcap-qvl = { git = "https://github.com/Phala-Network/dcap-qvl", rev = "94208e2753a854191759e493ca5892be482ad453", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = { package = "serde-human-bytes", version = "0.1" }
scale = { package = "parity-scale-codec", version = "3" }
hex = "0.4"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
