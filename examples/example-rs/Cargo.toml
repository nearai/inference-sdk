[package]
name = "example-rs"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "example-rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12.26", features = ["json", "stream"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
nearai-inference-sdk = { path = "../../rs" }

[[bin]]
name = "gateway-chat-completions-bare"
path = "src/gateway/chat_completions_bare.rs"

[[bin]]
name = "gateway-chat-completions"
path = "src/gateway/chat_completions.rs"

[[bin]]
name = "direct-chat-completions-bare"
path = "src/direct/chat_completions_bare.rs"

[[bin]]
name = "direct-chat-completions"
path = "src/direct/chat_completions.rs"

[[bin]]
name = "responses"
path = "src/gateway/responses.rs"

[[bin]]
name = "messages"
path = "src/gateway/messages.rs"

[[bin]]
name = "jev"
path = "src/gateway/jev.rs"
