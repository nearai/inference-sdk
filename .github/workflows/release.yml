name: Publish package
run-name: Publish ${{ inputs.language }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      language:
        description: SDK to publish
        required: true
        type: choice
        options:
          - javascript
          - python
          - rust
      version:
        description: Version in the selected package manifest, without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.repository == 'nearai/inference-sdk'
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            printf 'Run this workflow from %s, not %s.\n' \
              "$DEFAULT_BRANCH" "$GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging==25.0
      - name: Check selected package version
        id: version
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          language = os.environ["RELEASE_LANGUAGE"]
          version = os.environ["RELEASE_VERSION"]
          if language == "javascript":
              path = Path("js/package.json")
              expected = json.loads(path.read_text(encoding="utf-8"))["version"]
              prefix = "npm"
          elif language == "python":
              path = Path("py/pyproject.toml")
              expected = tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
              prefix = "pypi"
          elif language == "rust":
              path = Path("rs/Cargo.toml")
              expected = tomllib.loads(path.read_text(encoding="utf-8"))["package"]["version"]
              prefix = "crates"
          else:
              raise SystemExit(f"Unknown language: {language!r}")

          if version != expected:
              raise SystemExit(
                  f"Requested version {version!r} does not match {path}: {expected!r}."
              )

          if language == "python":
              parsed = Version(version)
              if str(parsed) != version or parsed.local is not None:
                  raise SystemExit("Use a normalized public PEP 440 version, such as 1.0.0rc1.")
              prerelease = parsed.is_prerelease
          else:
              number = r"(?:0|[1-9][0-9]*)"
              identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              match = re.fullmatch(
                  rf"{number}\.{number}\.{number}(?:-({identifier}(?:\.{identifier})*))?",
                  version,
              )
              if match is None:
                  raise SystemExit("Use X.Y.Z or a prerelease such as X.Y.Z-rc.1.")
              prerelease = match.group(1) is not None

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"release-tag={prefix}-v{version}", file=output)
              print(f"prerelease={str(prerelease).lower()}", file=output)
              print(f"npm-tag={'next' if prerelease else 'latest'}", file=output)
          PY

  checks:
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    with:
      language: ${{ inputs.language }}

  create-release:
    needs:
      - validate-release
      - checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create package tag and draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              printf 'Tag %s already points to a different commit.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              printf 'GitHub Release %s is already published.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            exit 0
          fi
          gh release create "$RELEASE_TAG" --draft --generate-notes \
            --title "$RELEASE_TAG" --verify-tag --prerelease="$PRERELEASE"

  publish-npm:
    if: inputs.language == 'javascript'
    needs:
      - validate-release
      - create-release
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: js
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ needs.validate-release.outputs.npm-tag }}
        run: |
          if npm view "@nearai/inference-sdk@$RELEASE_VERSION" version >/dev/null 2>&1; then
            printf '@nearai/inference-sdk@%s already exists on npm.\n' "$RELEASE_VERSION"
            exit 0
          fi
          npm publish --access public --tag "$NPM_TAG"

  build-python:
    if: inputs.language == 'python'
    needs: create-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: py/dist/
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-crates:
    if: inputs.language == 'rust'
    needs: create-release
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: rs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether the crate is already published
        id: crate-version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if curl --fail --silent --show-error \
            "https://crates.io/api/v1/crates/nearai-inference-sdk/$RELEASE_VERSION" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - id: crates-io-auth
        if: steps.crate-version.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.crate-version.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io

  publish-release:
    needs:
      - validate-release
      - publish-npm
      - publish-pypi
      - publish-crates
    # The two unselected registries are skipped, not failed dependencies.
    if: >-
      ${{ !cancelled() &&
          ((inputs.language == 'javascript' && needs.publish-npm.result == 'success') ||
           (inputs.language == 'python' && needs.publish-pypi.result == 'success') ||
           (inputs.language == 'rust' && needs.publish-crates.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
