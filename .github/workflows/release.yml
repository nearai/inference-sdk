name: Publish packages
run-name: Publish SDKs ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v, e.g. 0.2.0 or 0.2.0-rc.1 (Python becomes 0.2.0rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.repository == 'nearai/inference-sdk'
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}
      packages: ${{ steps.version.outputs.packages }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            printf 'Run this workflow from %s, not %s.\n' \
              "$DEFAULT_BRANCH" "$GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check all package versions
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python .github/scripts/release_plan.py

  checks:
    needs: validate-release
    uses: ./.github/workflows/ci.yml

  live-checks:
    needs: validate-release
    uses: ./.github/workflows/e2e.yml
    secrets:
      NEARAI_STG_API_KEY: ${{ secrets.NEARAI_STG_API_KEY }}
      NEARAI_PRD_API_KEY: ${{ secrets.NEARAI_PRD_API_KEY }}

  create-release:
    needs:
      - validate-release
      - checks
      - live-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create shared tag and draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
          RELEASE_PACKAGES: ${{ needs.validate-release.outputs.packages }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
        run: |
          source .github/scripts/release.sh
          create_github_release

  publish-npm:
    needs:
      - validate-release
      - create-release
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: js
    permissions:
      contents: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ fromJSON(needs.validate-release.outputs.packages).javascript.tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.validate-release.outputs.packages).javascript.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Upload npm package
        env:
          NPM_TAG: ${{ needs.validate-release.outputs.npm-tag }}
        run: |
          source ../.github/scripts/release.sh
          verify_npm_channel
          verify_release_tag
          npm publish --access public --tag "$NPM_TAG"

  build-python:
    needs: create-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: py/dist/
          if-no-files-found: error
          overwrite: true

  publish-pypi:
    needs:
      - validate-release
      - build-python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ fromJSON(needs.validate-release.outputs.packages).python.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Verify release tag
        run: |
          source .github/scripts/release.sh
          verify_release_tag
      - name: Upload Python distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  publish-crates:
    needs:
      - validate-release
      - create-release
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: rs
    permissions:
      contents: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ fromJSON(needs.validate-release.outputs.packages).rust.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Upload crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          source ../.github/scripts/release.sh
          verify_release_tag
          cargo publish --locked --registry crates-io

  publish-go:
    needs:
      - validate-release
      - create-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ fromJSON(needs.validate-release.outputs.packages).go.tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.validate-release.outputs.packages).go.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
      # Pushing the Go tag is publication, so it happens only after checks and
      # the release environment approval, unlike registry upload jobs.
      - name: Publish module tag
        run: |
          source .github/scripts/release.sh
          create_release_tag
      - name: Verify public proxy and fresh CGO-disabled consumer
        env:
          CGO_ENABLED: "0"
        run: bash .github/scripts/verify-go-release.sh

  publish-release:
    needs:
      - validate-release
      - create-release
      - publish-npm
      - publish-pypi
      - publish-crates
      - publish-go
    # Report partial failures; publish the shared release only after all SDKs succeed.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish GitHub release and summarize results
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
          PUBLISH_RESULTS: >-
            {"javascript":"${{ needs.publish-npm.result }}",
             "python":"${{ needs.publish-pypi.result }}",
             "rust":"${{ needs.publish-crates.result }}",
             "go":"${{ needs.publish-go.result }}"}
        run: |
          source .github/scripts/release.sh
          publish_github_release
