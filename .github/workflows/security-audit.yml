name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Audit findings are report-only until the existing backlog is triaged.
# Remove the audit steps' continue-on-error flags to gate merges.
# Separate setup/export steps
# remain blocking; no advisory IDs are suppressed.
jobs:
  typescript:
    name: TypeScript (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [js, examples/example-js]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # pnpm audit reads the lockfile; no dependency install or scripts needed.
      - name: Audit runtime and development dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit
      - name: Summarize audit outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "pnpm audit: $AUDIT_OUTCOME (report-only; see the audit step for findings or errors)." >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [py, examples/example-py]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Export locked runtime and development dependencies
        # Omit the local SDK itself, but retain all of its dependencies when
        # exporting the example's lockfile. Keep hashes for pip-audit.
        run: >-
          uv export --locked --all-groups --no-emit-project
          --no-emit-package nearai-inference-sdk --format requirements-txt
          --output-file "$RUNNER_TEMP/audit-requirements.txt"
      - name: Install audit tool
        run: uv tool install pip-audit==2.10.1
      - name: Audit locked dependencies
        id: audit
        continue-on-error: true
        run: >-
          uv tool run pip-audit --require-hashes --disable-pip
          --requirement "$RUNNER_TEMP/audit-requirements.txt"
      - name: Summarize audit outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "pip-audit: $AUDIT_OUTCOME (report-only; see the audit step for findings or errors)." >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [rs, examples/example-rs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Audit locked dependencies against RustSec
        id: audit
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.directory }}/Cargo.toml
          rust-version: stable
          arguments: --locked --all-features --config deny.toml
          command: check advisories
      - name: Summarize audit outcome
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "cargo deny: $AUDIT_OUTCOME (report-only; see the audit step for findings or errors)." >> "$GITHUB_STEP_SUMMARY"

  go:
    name: Go (SDK and example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go/go.sum
            examples/example-go/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/nearai-dcap-qvl
          key: go-dcap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/scripts/build-dcap.sh') }}
      - name: Build pinned DCAP library
        run: |
          DCAP_LIBRARY_DIR="$(go/scripts/build-dcap.sh)"
          echo "CGO_LDFLAGS=-L$DCAP_LIBRARY_DIR" >> "$GITHUB_ENV"
      - name: Install Go vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Audit Go SDK
        id: sdk-audit
        continue-on-error: true
        working-directory: go
        run: govulncheck ./...
      - name: Audit Go example
        id: example-audit
        continue-on-error: true
        working-directory: examples/example-go
        run: govulncheck ./...
      - name: Summarize audit outcomes
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk-audit.outcome }}
          EXAMPLE_OUTCOME: ${{ steps.example-audit.outcome }}
        run: |
          echo "Go SDK: $SDK_OUTCOME; Go example: $EXAMPLE_OUTCOME (report-only; see audit steps)." >> "$GITHUB_STEP_SUMMARY"
