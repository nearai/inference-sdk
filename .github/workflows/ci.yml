name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      language:
        description: SDK to check, or all for the full suite
        type: string
        default: all

permissions:
  contents: read

jobs:
  javascript:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'javascript'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Typecheck live tests without contacting the service
        run: |
          pnpm typecheck:e2e
          node --check ../e2e/select-models.mjs
      - name: Check JavaScript example
        working-directory: examples/example-js
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  python:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'python'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: make lint
      - run: uv build
      - name: Check Python examples
        working-directory: examples/example-py
        run: |
          uv sync --locked
          uv run python -c "from gateway import bare, client, client_openai_sdk; from direct import bare, client, client_openai_sdk"

  rust:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'rust'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: make check

  go:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'go'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            examples/example-go/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/nearai-dcap-qvl
          key: go-dcap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/scripts/build-dcap.sh') }}
      - name: Build pinned DCAP library
        run: |
          DCAP_LIBRARY_DIR="$(go/scripts/build-dcap.sh)"
          echo "CGO_LDFLAGS=-L$DCAP_LIBRARY_DIR" >> "$GITHUB_ENV"
      - run: make -C go check
      - name: Check Go OpenAI integration example
        working-directory: examples/example-go
        run: go test -race ./...
