name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      language:
        description: SDK to check, or all for the full suite
        type: string
        default: all

permissions:
  contents: read

jobs:
  javascript:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'javascript'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check JavaScript example
        working-directory: examples/example-js
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  python:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'python'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make lint
      - run: uv build

  rust:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'rust'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
