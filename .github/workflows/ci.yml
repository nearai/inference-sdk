name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      language:
        description: SDK to check, or all for the full suite
        type: string
        default: all

permissions:
  contents: read

jobs:
  javascript:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'javascript'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check live tests without contacting the service
        run: |
          pnpm typecheck:e2e
          node --test e2e/*.spec.ts
          node --test ../e2e/select-models.test.mjs
      - name: Check JavaScript example
        working-directory: examples/example-js
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  python:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'python'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: make lint
      - run: uv build
      - name: Check Python examples
        working-directory: examples/example-py
        run: |
          uv sync --locked
          ../../py/.venv/bin/ruff format --check .
          ../../py/.venv/bin/ruff check .
          uv run python -m unittest discover
          uv run python -c "from gateway import bare, client, client_openai_sdk, jev, jev_sdk, responses, responses_openai_sdk, messages, messages_anthropic_sdk; from direct import bare, client, client_openai_sdk"

  rust:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'rust'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: make check
      - name: Check Rust examples
        working-directory: examples/example-rs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  go:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'go'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            examples/example-go/go.sum
      - name: Check shared response fixtures
        run: |
          cmp rs/test-fixtures/systemone-responses.json go/testdata/systemone-responses.json
          for fixture in message.json message.sse streams.json; do
            cmp "test-fixtures/messages/$fixture" "rs/test-fixtures/messages/$fixture"
            cmp "test-fixtures/messages/$fixture" "go/testdata/messages/$fixture"
          done
      - run: make -C go check
      - name: Verify consumer builds without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          go -C go test ./...
          go -C examples/example-go test ./...
          go -C examples/example-go build ./...
      - name: Test live model selection without credentials
        working-directory: go
        run: go test -tags=e2e ./e2e -run '^TestSelectedModels$'
      - name: Check Go SDK integration examples
        working-directory: examples/example-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go test -tags=e2e -run '^$' .

  go-verifier-artifact:
    if: inputs.language == '' || inputs.language == 'all' || inputs.language == 'go'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: wasm32-wasip1
      - name: Check wrapper formatting and reproduce embedded verifier
        run: |
          cargo fmt --manifest-path go/internal/dcap/wasm-src/Cargo.toml --check
          go/scripts/build-dcap-wasm.sh
          git diff --exit-code -- go/internal/dcap/dcap.wasm
