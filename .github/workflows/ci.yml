name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check packed SDK in a clean consumer
        run: |
          pnpm pack --out "$RUNNER_TEMP/inference-sdk.tgz"
          mkdir "$RUNNER_TEMP/inference-sdk-consumer"
          cd "$RUNNER_TEMP/inference-sdk-consumer"
          pnpm add "$RUNNER_TEMP/inference-sdk.tgz" --strict-peer-dependencies --ignore-scripts
          node --input-type=module -e "await import('@nearai/inference-sdk'); await import('@nearai/inference-sdk/node');"
      - name: Check JavaScript example
        working-directory: examples/example-js
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make lint
      - run: uv build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
