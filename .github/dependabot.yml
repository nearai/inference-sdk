version: 2
# Only security updates may open pull requests. A zero limit disables version
# updates without affecting security updates. The schedule remains required
# by Dependabot's configuration schema.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/js"
      - "/examples/example-js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "uv"
    directories:
      - "/py"
      - "/examples/example-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "cargo"
    directories:
      - "/rs"
      - "/examples/example-rs"
      - "/go/internal/dcap/wasm-src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "gomod"
    directories:
      - "/go"
      - "/examples/example-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
