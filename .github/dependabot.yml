version: 2
# SDK packages receive security updates only. A zero limit disables version
# updates without affecting security updates; the schedule remains required.
# GitHub Actions retain weekly grouped version updates for their SHA pins.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/js"
      - "/examples/example-js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "uv"
    directories:
      - "/py"
      - "/examples/example-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "cargo"
    directories:
      - "/rs"
      - "/examples/example-rs"
      - "/go/internal/dcap/wasm-src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directories:
      - "/go"
      - "/examples/example-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
