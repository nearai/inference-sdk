[package]
name = "verification-sdk"
version = "0.1.0"
edition = "2021"
description = "Verification SDK"
license = "MIT"

[dependencies]
# Runtime / HTTP
tokio = "1.48.0"
reqwest = { version = "0.12.26", features = ["json"] }

# Serialization / parsing
serde = "1.0.228"
serde_json = "1.0.145"
base64 = "0.22.1"
hex = "0.4.3"
regex = "1.12.2"

# Crypto / signatures / hashing
sha2 = "0.10.9"
sha3 = "0.10.8"
k256 = { version = "0.13.4", features = ["ecdsa", "sha256"] }
ed25519-dalek = "2.2.0"
alloy-primitives = "1.5.1"

# Certificates / TLS
x509-cert = { version = "0.2.5", features = ["pem"] }
rustls = "0.23.35"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.4"

# Attestation verification
dcap-qvl = "0.3.4"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.100"
