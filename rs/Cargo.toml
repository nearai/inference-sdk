[package]
name = "verifiable-ai-sdk"
version = "0.1.0"
edition = "2021"
description = "Verification SDK for NEAR AI Cloud attestations"
license = "MIT"
repository = "https://github.com/nearai/verifiable-ai-sdk"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12.26", features = ["json"] }
x509-cert = { version = "0.2.5", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
base64 = "0.22.1"
hex = "0.4.3"
async-trait = "0.1.89"
rand = "0.8.5"
parity-scale-codec = "3.7.5"

sha2 = "0.10.9"
sha3 = "0.10.8"
k256 = "0.13.4"
ed25519-dalek = "2.2.0"

dcap-qvl = "0.3.9"

thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "net"] }
wiremock = "0.6.5"
