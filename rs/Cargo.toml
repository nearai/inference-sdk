[package]
name = "nearai-inference-sdk"
version = "0.1.0"
edition = "2021"
description = "Verification SDK for NEAR AI Cloud attestations"
license = "MIT"
repository = "https://github.com/nearai/inference-sdk"
readme = "README.md"
# This repository-only test uses a signed fixture shared by all three SDKs
# outside the crate root. Do not publish a test whose fixture is unavailable.
# Live E2E tests also stay in the repository, not the published crate.
exclude = ["tests/image_provenance.rs", "e2e/**"]

[[test]]
name = "e2e"
path = "e2e/gateway.rs"

[dependencies]
reqwest = { version = "0.12.26", features = ["json", "rustls-tls", "stream"] }
x509-cert = { version = "0.2.5", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
serde_path_to_error = "0.1.20"
base64 = "0.22.1"
hex = "0.4.3"
async-trait = "0.1.89"
rand = "0.8.5"

sha2 = "0.10.9"
sha3 = "0.10.8"
k256 = { version = "0.13.4", features = ["ecdh"] }
ed25519-dalek = "2.2.0"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }

dcap-qvl = "0.3.9"

thiserror = "2.0.17"
sigstore-verify = { version = "0.11.0", default-features = false }

tokio = { version = "1.48.0", features = ["sync", "time", "rt"] }
futures-util = { version = "0.3", features = ["io"] }
async-stream = "0.3"
bytes = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
ohttp = { version = "0.7.2", default-features = false, features = ["client", "rust-hpke", "stream"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ohttp = { version = "0.7.2", default-features = false, features = ["server", "client", "rust-hpke", "stream"] }
futures = "0.3"
bhttp = "0.7.2"

tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
wiremock = "0.6.5"
