[package]
name = "verification-sdk"
version = "0.1.0"
edition = "2021"
description = "Verification SDK"
license = "MIT"

[dependencies]
dcap-qvl = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.26", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
alloy-primitives = "1.5.1"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha3 = "0.10"
ed25519-dalek = "2"
x509-cert = { version = "0.2", features = ["pem"] }
rustls = "0.23.35"
tokio-rustls = "0.26.4"
regex = "1"
base64 = "0.22"
thiserror = "2.0.17"
anyhow = "1.0.100"
webpki-roots = "1.0.4"
