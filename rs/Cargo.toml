[package]
name = "verification-sdk"
version = "0.1.0"
edition = "2021"
description = "Verification SDK"
license = "MIT"

[dependencies]
dcap-qvl = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
alloy-primitives = "0.1"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha3 = "0.10"
ed25519-dalek = "2"
x509-parser = "0.18"
rustls = "0.22"
rustls-pemfile = "2"
rustls-native-certs = "0.6"
tokio-rustls = "0.25"
regex = "1"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"

