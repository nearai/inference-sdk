[project]
name = "verifiable-ai-sdk"
version = "0.1.0"
description = "Verification SDK for NEAR AI Cloud attestations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.0",
    "cryptography>=44.0.0",
    "eth-account>=0.10.0",
    "dcap-qvl>=0.3.9",
    "pynacl>=1.5.0",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/nearai/verifiable-ai-sdk"
Documentation = "https://github.com/nearai/verifiable-ai-sdk/tree/main/py/docs"
