[project]
name = "nearai-inference-sdk"
version = "0.1.0"
description = "Verification SDK for NEAR AI Cloud attestations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.0",
    "httpx>=0.28.1,<0.29",
    # TLS pinning uses this version's documented handshake trace event.
    "httpcore==1.0.9",
    "openai>=2.0.0,<3",
    "cryptography>=44.0.0",
    "pyhpke==0.6.5",
    "eth-account>=0.10.0",
    "eth-utils>=2.0.0",
    "dcap-qvl>=0.3.9",
    "pynacl>=1.5.0",
    "pydantic>=2.12.5",
    "pyasn1>=0.6.4,<0.7",
    "ruamel.yaml>=0.19.1,<0.20",
    "sigstore>=4.5.0,<5",
    "PyJWT[crypto]==2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/nearai/inference-sdk"
Documentation = "https://github.com/nearai/inference-sdk/tree/main/py/docs"
